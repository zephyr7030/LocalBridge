name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      # Local release candidates and GitHub execute this exact ordered gate.
      # Add or change a stage in scripts/test/ci-gate.mjs, never in two places.
      - run: node scripts/test/ci-gate.mjs
