name: Feature request
description: 提议一个明确的 LocalBridge 改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明真实使用场景，不要包含凭据或隐私数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 权限/安全影响
      description: 如果涉及 Shell、文件系统、MCP、Tunnel、Broker 或 UAC，请说明预期边界。
