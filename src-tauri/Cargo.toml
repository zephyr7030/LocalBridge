[package]
name = "localbridge"
version = "0.1.0"
description = "LocalBridge desktop shell"
authors = ["LocalBridge"]
edition = "2024"
rust-version = "1.85"
autobins = false

[lib]
name = "localbridge_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "localbridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[test]]
name = "lb003_settings_persistence"
path = "../tests/unit/settings/settings_persistence.rs"

[[test]]
name = "lb003_workspace_registry"
path = "../tests/unit/workspace/workspace_registry.rs"

[[test]]
name = "lb003_migration_matrix"
path = "../tests/migrations/migration_matrix.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
